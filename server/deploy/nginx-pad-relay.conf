# kantor-rpg pad relay (REQ-HP-06). Include inside the employee-rpg server block:
#   include /etc/nginx/snippets/kantor-pad-relay.conf;
# Cloudflare passes WebSockets on the free plan; keep the 1 h read timeout so an
# idle lobby is not cut (the relay pings every 30 s and closes idle rooms itself).
location = /pad-relay/health {
  proxy_pass http://127.0.0.1:8791;
  proxy_http_version 1.1;
  add_header Cache-Control "no-store" always;
}
location = /pad-relay {
  proxy_pass http://127.0.0.1:8791;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header Origin $http_origin;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
  proxy_buffering off;
  access_log off;
  add_header X-Robots-Tag "noindex, nofollow" always;
}
