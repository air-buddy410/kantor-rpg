name: ci
on:
  pull_request:
  push:
    branches: [main, "claude/**"]
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System packages for PDF rendering and the OFL font
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils fonts-alegreya-sans
      - run: pip install -r requirements-dev.txt
      - name: Safety scan
        run: python3 tools/safety_scan.py
      - name: Validate world dataset
        run: python3 tools/validate_world.py
      - name: Contrast tokens
        run: python3 tools/contrast.py
      - name: Python tests
        run: python3 -m pytest tests/py -q
  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E (desktop, tablet, mobile viewports)
        run: npx playwright test tests/e2e/world.spec.ts
